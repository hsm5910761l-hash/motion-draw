<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" width="400" height="452">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24384f"/>
      <stop offset="55%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#0d1624"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c983"/>
      <stop offset="45%" stop-color="#c9a04a"/>
      <stop offset="100%" stop-color="#9e782c"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M200 24 L352 72 V226 C352 316 286 376 200 406 C114 376 48 316 48 226 V72 Z"/>
    </clipPath>
  </defs>

  <!-- 盾牌 -->
  <path d="M200 24 L352 72 V226 C352 316 286 376 200 406 C114 376 48 316 48 226 V72 Z"
        fill="url(#navy)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>

  <g clip-path="url(#shieldClip)">
    <!-- 光芒 -->
    <g stroke="#c9a04a" stroke-width="3.6" stroke-linecap="round" opacity=".6">
      <line x1="200" y1="58" x2="200" y2="84"/>
      <line x1="158" y1="70" x2="170" y2="93"/>
      <line x1="242" y1="70" x2="230" y2="93"/>
      <line x1="124" y1="100" x2="144" y2="115"/>
      <line x1="276" y1="100" x2="256" y2="115"/>
      <line x1="106" y1="146" x2="132" y2="152"/>
      <line x1="294" y1="146" x2="268" y2="152"/>
      <line x1="104" y1="196" x2="130" y2="194"/>
      <line x1="296" y1="196" x2="270" y2="194"/>
    </g>

    <!-- 朝陽 -->
    <circle cx="200" cy="172" r="64" fill="url(#gold)" opacity=".22"/>
    <circle cx="200" cy="172" r="64" fill="url(#gold)"/>

    <!-- 對話氣泡 -->
    <g>
      <rect x="108" y="178" width="184" height="102" rx="22" fill="#f7f2e8"/>
      <path d="M152 280 L152 304 L186 280 Z" fill="#f7f2e8"/>
      <circle cx="148" cy="229" r="9" fill="#16233a"/>
      <circle cx="200" cy="229" r="9" fill="#16233a"/>
      <circle cx="252" cy="229" r="9" fill="#16233a"/>
    </g>

    <!-- 窗戶：向校徽四方格致敬 -->
    <g>
      <rect x="170" y="306" width="60" height="60" rx="4" fill="none" stroke="#c9a04a" stroke-width="4.5"/>
      <line x1="200" y1="306" x2="200" y2="366" stroke="#c9a04a" stroke-width="4.5"/>
      <line x1="170" y1="336" x2="230" y2="336" stroke="#c9a04a" stroke-width="4.5"/>
    </g>

  </g>

  <!-- 彩帶 -->
  <g>
    <path d="M58 392 H342 L360 415 L342 438 H58 L40 415 Z" fill="url(#gold)"/>
    <text x="200" y="422" text-anchor="middle"
          font-family="Georgia,'Times New Roman',serif" font-size="16.5"
          letter-spacing="3.2" fill="#16233a" font-weight="700">SAPIENTIA ET LUX</text>
  </g>
</svg>
